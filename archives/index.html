<!DOCTYPE html>
<html>
    <head>
        <title>Visit Time || kpoovakan</title>
        <style>
            body {
                background-color: black;
                color: white;
                font-family: sans-serif;
                font-size: 31px;
                position: relative;
                display: block;
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
            }
            h1 {
                text-align: center;
                width: 100%;
            }
            h2 {
                text-align: center;
                width: 100%;
            }
            .wrapper {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        </style>
        <script>
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            window.addEventListener("load", async function() {
                await streak();
                ten();
                sec();
                //min();
            });
            function streak() {
                var streak = Number(window.localStorage.getItem("visittimeStreak"));
                if (streak) {
                    streak++;
                } else {
                    var streak = 1;
                }
                document.getElementById("streak").innerText = streak;
                window.localStorage.setItem("visittimeStreak", streak);
            }
            async function sec() {
                while (true) {
                    await wait(1000);
                    let cur = document.getElementById("sec").innerText;
                    cur = Number(cur);
                    cur = cur + 1;
                    document.getElementById("sec").innerText = cur;
                }
            }
            async function ten() {
                while (true) {
                    await wait(100);
                    let cur = document.getElementById("ten").innerText;
                    cur = Number(cur);
                    cur = cur + 1;
                    document.getElementById("ten").innerText = cur;
                    if (cur % 60 == 0) {
                        let min = Number(document.getElementById("min").innerText);
                        min = min + 1;
                        document.getElementById("min").innerText = min;
                    }
                }
            }
        </script>
    </head>
    <body>
        <div class="wrapper">
            <h1>Visit Time</h1>
            <h2><span id="ten">0</span> deciseconds</h2>
            <h2><span id="sec">0</span> seconds</h2>
            <h2><span id="min">0</span> minutes</h2>
            <h2>you've visited this page <span id="streak"></span> times</h2>
        </div>
    </body>
</html>
