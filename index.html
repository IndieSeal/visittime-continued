<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Visit Time</title>
        <link rel="stylesheet" type="text/css" href="./css/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+AR+Guides&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+IT+Trad:wght@100..400&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="snowParticles" class="screenOverlay"></div>

            <!--
        <div class="corner">
            <img class="corner clock" src="./imgs/clock.svg">
        </div>
            -->

        <div class="center">
            <h class="fancyFont" style="margin: 0; font-size: 70px;">Visit Time</h>
            
            <div style="display: flex; width: 100%; flex-direction: column; justify-content: center;">
                <div class="divideClose">
                    <p><span id=ten>0</span> deciseconds</p>
                    <p><span id=sec>0</span> seconds</p>
                </div>
            
                <div class="divideClose">
                    <p><span id=min>0</span> minutes</p>
                    <p><span id=hr>0</span> hours</p>
                </div>
        
                <div class="divideClose">
                    <p><span id=day>0</span> days</p>
                    <p><span id=year>0</span> years</p>
                </div>
            </div>

            <p style="margin: 20px 0;" id="timer">00ʰ:00ᵐ:00ˢ.0ᵈ</p>
            <p style="margin: 0;">you've visited this page <span id=str></span> times</p>

            <div style="display: flex; height: 70px;"></div>

            <div class="divideClose">
                <button class="start" id="StartStop">Start</button>
                <button class="restart" id="Restart">Reset</button>
            </div>
        </div>

        <audio id="hourClock"> <source src="./audio/hourClock.mp3" type="audio/mpeg"> </audio>

        <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
        <script type="module" src="./scripts/timer.js"></script>
        <script src="./scripts/snowParticles.js"></script>
    </body>
</html>
